name: Preparar aplicación unificada

on:
  push:
    branches:
      - integracion/base-unificada
    paths:
      - .github/workflows/preparar-app.yml

permissions:
  contents: write

concurrency:
  group: preparar-app
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama de integración
        uses: actions/checkout@v4
        with:
          ref: integracion/base-unificada
          persist-credentials: true

      - name: Montar visor y editor AR
        shell: bash
        run: |
          set -euo pipefail
          test -s migration/reference/prototipo-ar/index.html
          test -s migration/reference/prototipo-ar/editor.html
          mkdir -p public
          rm -rf public/visor
          cp -a migration/reference/prototipo-ar public/visor
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex,nofollow">
            <meta http-equiv="refresh" content="0;url=./visor/">
            <title>Visor AR</title>
          </head>
          <body><p>Abriendo <a href="./visor/">Visor AR</a>…</p></body>
          </html>
          HTML
          cat > public/README.md <<'DOC'
          # Aplicación AR integrada

          - Visor público: ./visor/
          - Editor AR: ./visor/editor.html
          - Inicio de sesión: ./visor/login.html

          El editor requiere configuración y validación de Supabase antes de habilitar su uso.
          Esta copia conserva temporalmente la estructura y rutas relativas originales para validar compatibilidad.
          DOC

      - name: Verificar catálogo y activos
        shell: bash
        run: |
          set -euo pipefail
          test -s public/visor/index.html
          test -s public/visor/editor.html
          test -s public/visor/catalogo.json
          test -s public/visor/targets.mind
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('public/visor/catalogo.json','utf8'));if(!Array.isArray(c.cuadros)||c.cuadros.length!==2)process.exit(1);console.log(c.cuadros.map(x=>x.id+': '+(x.capas||[]).length+' capas').join('\\n'))"
          echo "Files: $(find public/visor -type f | wc -l)"
          echo "Size: $(du -sh public/visor | cut -f1)"

      - name: Guardar aplicación integrada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: assemble AR viewer and primary editor"
          git push origin HEAD:integracion/base-unificada
