name: Normalizar optimización inicial AR

on:
  push:
    branches:
      - integracion/base-unificada
    paths:
      - .github/workflows/optimizar-inicial.yml

permissions:
  contents: write

concurrency:
  group: optimizacion-inicial-ar
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integracion/base-unificada
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Sharp
        run: npm install --prefix .ar-tools --no-package-lock --no-save sharp@0.34.4
      - name: Optimizar capas referenciadas y limpiar manifiesto
        run: |
          cp scripts/optimizar-imagenes-ar.mjs .ar-tools/optimizar.mjs
          node .ar-tools/optimizar.mjs
      - name: Validar catálogo y recursos
        run: node scripts/validar-static-ar.mjs
      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/visor
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: normalize optimized AR asset manifest"
          git push origin HEAD:integracion/base-unificada
