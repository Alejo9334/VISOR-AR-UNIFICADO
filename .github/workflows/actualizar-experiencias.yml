name: Actualizar experiencia AR existente

on:
  push:
    branches:
      - integracion/base-unificada
    paths:
      - 'proyectos/actualizaciones/*.json'

permissions:
  contents: write

concurrency:
  group: actualizar-experiencia-ar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integracion/base-unificada
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Identificar un único JSON nuevo
        id: request
        shell: bash
        run: |
          set -euo pipefail
          PARENT="$(git rev-parse "${GITHUB_SHA}^")"
          mapfile -t FILES < <(git diff-tree --no-commit-id --name-only -r "$PARENT" "$GITHUB_SHA" | grep -E '^proyectos/actualizaciones/[a-zA-Z0-9._-]+\.json$' || true)
          if [[ "${#FILES[@]}" -ne 1 ]]; then echo "Se esperaba exactamente un JSON de actualización." >&2; exit 1; fi
          test -s "${FILES[0]}"
          echo "file=${FILES[0]}" >> "$GITHUB_OUTPUT"
      - name: Proteger índice de reconocimiento
        run: sha256sum public/visor/targets.mind | cut -d' ' -f1 > /tmp/targets.before
      - name: Actualizar solo la experiencia solicitada
        env:
          REQUEST_FILE: ${{ steps.request.outputs.file }}
        run: node scripts/actualizar-cuadro.mjs "$REQUEST_FILE" public/visor
      - name: Instalar optimizador
        run: npm install --prefix .ar-tools --no-package-lock --no-save sharp@0.34.4
      - name: Optimizar capas sin borrar PNG originales
        run: |
          cp scripts/optimizar-imagenes-ar.mjs .ar-tools/optimizar.mjs
          node .ar-tools/optimizar.mjs
      - name: Verificar que el marcador no cambió
        run: sha256sum --check <(printf '%s  %s\n' "$(cat /tmp/targets.before)" public/visor/targets.mind)
      - name: Validar proyecto
        run: node scripts/validar-static-ar.mjs
      - name: Guardar actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/visor
          git diff --cached --quiet && { echo 'Sin cambios para guardar'; exit 0; }
          git commit -m "feat: update one AR experience"
          git push origin HEAD:integracion/base-unificada
