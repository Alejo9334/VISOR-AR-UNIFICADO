name: Validar integración AR

on:
  push:
    branches:
      - main
      - integracion/base-unificada
    paths:
      - public/visor/**
      - scripts/**
      - .github/workflows/validar-integracion.yml
  pull_request:
    branches:
      - main
      - integracion/base-unificada

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis de scripts
        run: |
          for file in scripts/*.mjs; do node --check "$file"; done
      - name: Validar lógica del editor y visor
        run: node scripts/verificar-prototipo-ar.mjs
      - name: Probar actualizaciones seguras
        run: node scripts/verificar-actualizacion-ar.mjs
      - name: Probar publicación de cuadros nuevos
        run: node scripts/verificar-publicacion-ar.mjs
      - name: Validar catálogo y recursos publicados
        run: node scripts/validar-static-ar.mjs
      - name: Confirmar que no queden enlaces de repositorios antiguos
        run: |
          ! grep -R -nE 'github.com/Alejo9334/(Code-fuente|Visor-AR|Visor-222)/upload' public/visor
