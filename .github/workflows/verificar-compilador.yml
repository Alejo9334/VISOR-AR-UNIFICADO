name: Verificar compilador MindAR

on:
  push:
    branches:
      - integracion/base-unificada
    paths:
      - .github/workflows/verificar-compilador.yml

permissions:
  contents: read

jobs:
  compile-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar compilador MindAR y Canvas
        run: npm install --prefix .ar-tools --no-package-lock --no-save mind-ar@1.2.5 canvas@2.11.2
      - name: Preparar copia aislada del catálogo
        run: |
          mkdir -p /tmp/ar-compiler-check/public
          cp -a public/visor /tmp/ar-compiler-check/public/visor
          cp scripts/compilar-objetivos-ar.mjs .ar-tools/compilar.mjs
      - name: Compilar objetivos sin tocar el catálogo de producción
        working-directory: /tmp/ar-compiler-check
        run: node $GITHUB_WORKSPACE/.ar-tools/compilar.mjs
      - name: Verificar salida compilada
        run: |
          test -s /tmp/ar-compiler-check/public/visor/targets.mind
          node -e "const c=require('/tmp/ar-compiler-check/public/visor/catalogo.json');if(c.compilador.cantidadObjetivos!==c.cuadros.length)process.exit(1);console.log(c.compilador)"
